[package]
name = "rust-microsip-telephony"
description = "Experimental G0 SIP adapter; not production-approved"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rsipstack = { version = "=0.7.3", default-features = false, features = ["platform-tokio", "rustls"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
thiserror = "=2.0.21"
secrecy = "=0.10.3"
zeroize = "=1.9.1"

[dev-dependencies]
libc = "=0.2.190"
serde_json = "=1.0.154"

[lints]
workspace = true
