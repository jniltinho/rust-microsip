# Opt-in RFC 4733 IVR fixture; no default-profile or personal-account access.
# The Python registration peer is disabled to avoid duplicate fictional contacts.
services:
  pbx:
    environment:
      LAB_VERIFY_CONTACT: "1"
  peer:
    profiles: [registration-fixture-only]
  test-runner:
    image: rust-microsip-g0-controls:0.1.0-lab.1
    build:
      context: ../..
      target: g0-controls-runner
    command: !reset []
    depends_on: !override
      pbx: {condition: service_healthy}
