# Opt-in synthetic call pair: two Rust endpoints in one isolated runner process.
# The Python registration peer is disabled to avoid duplicate fictional contacts.
services:
  pbx:
    environment:
      LAB_VERIFY_CONTACT: "1"
  peer:
    profiles: [registration-fixture-only]
  test-runner:
    image: rust-microsip-g0-calls:0.1.0-lab.1
    build:
      context: ../..
      target: g0-calls-runner
    command: !reset []
    depends_on: !override
      pbx: {condition: service_healthy}
