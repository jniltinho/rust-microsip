schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  New project: native Rust desktop softphone for Linux first, named rust-microsip; compact MicroSIP UI, complementary GOnnect reference.
  PhotoCraft is an architecture reference, not a telephony engine to copy.
  UI uses Dialpad/Calls/Contacts tabs and light/dark/system themes; no full upstream parity.
  Portable platform contracts, Linux adapter first; macOS/Windows later.
  CLI and local stdio MCP are a linked change; Web/WASM full WebRTC calls are a later release.
  Local TOML or explicit dotenv, SQLite embedded, secrets outside database.
  Docker build and isolated Asterisk Docker tests; release requires actual two-way audio.
  base/ is local-only: never track, upload, package or include in build context.
  Current change is planning only; implementation requires explicit approval.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
