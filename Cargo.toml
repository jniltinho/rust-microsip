[workspace]
members = [
    "apps/rust-microsip",
    "crates/core",
    "crates/telephony",
    "crates/media",
    "crates/audio",
    "crates/config",
    "crates/storage",
    "crates/platform",
    "crates/platform-windows",
    "crates/control",
]
resolver = "3"
# Vendored crates keep their own manifests and lints (vendor/README.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/jniltinho/rust-microsip"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Patched copies of registry crates, reviewed in vendor/README.md.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
