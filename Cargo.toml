[workspace]
members = [
    "apps/rust-microsip",
    "crates/core",
    "crates/telephony",
    "crates/media",
    "crates/audio",
    "crates/config",
    "crates/storage",
    "crates/platform",
    "crates/control",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/jniltinho/rust-microsip"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
