[package]
name = "rust-microsip"
description = "Experimental rust-microsip softphone scaffold; G0 pending"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rust-microsip-core = { path = "../../crates/core" }
rust-microsip-telephony = { path = "../../crates/telephony" }
rust-microsip-audio = { path = "../../crates/audio" }
rust-microsip-config = { path = "../../crates/config" }
rust-microsip-storage = { path = "../../crates/storage" }
rust-microsip-platform = { path = "../../crates/platform" }
rust-microsip-control = { path = "../../crates/control" }
ring = "=0.17.14"
serde_json = "=1.0.154"
# Official MCP SDK; no macros (tools and schemas are written explicitly).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu_no_default_features", "wayland", "x11", "accesskit"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
secrecy = "=0.10.3"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "rt-multi-thread", "signal", "io-std"] }

# Windows renders through DX12 (WARP on GPU-less machines); Vulkan and GL
# are usually absent there.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.0", default-features = false, features = ["dx12"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client"] }
tokio = { version = "=1.53.2", default-features = false, features = ["process", "macros"] }

[lints]
workspace = true
