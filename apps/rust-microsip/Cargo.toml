[package]
name = "rust-microsip"
description = "Experimental rust-microsip softphone scaffold; G0 pending"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rust-microsip-core = { path = "../../crates/core" }
rust-microsip-telephony = { path = "../../crates/telephony" }
rust-microsip-audio = { path = "../../crates/audio" }
rust-microsip-config = { path = "../../crates/config" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu_no_default_features", "wayland", "x11", "accesskit"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
secrecy = "=0.10.3"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "signal"] }

[lints]
workspace = true
