# The only workflow that builds and publishes binaries: runs on version tags
# (v0.1.0, v0.1.0-rc.1). It publishes only a commit on main whose ci.yml push
# run is green, only after the owner approves the `release` environment, and a
# final version only when docs/release/vX.Y.Z.md checks every release gate.
# -rc.N tags are published as pre-releases.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  actions: read

jobs:
  # Refuse to run when the `release` environment lost its protection: GitHub
  # would otherwise create it unprotected and publish without approval.
  environment-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The release environment requires the owner's approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env=$(gh api "repos/$GITHUB_REPOSITORY/environments/release") \
            || { echo "the release environment does not exist" >&2; exit 1; }
          printf '%s' "$env" | jq -e '[.protection_rules[].type] | index("required_reviewers")' >/dev/null \
            || { echo "the release environment has no required reviewer" >&2; exit 1; }
          printf '%s' "$env" | jq -e '.can_admins_bypass == false' >/dev/null \
            || { echo "admins can bypass the release environment" >&2; exit 1; }
          printf '%s' "$env" | jq -e '.deployment_branch_policy.custom_branch_policies == true' >/dev/null \
            || { echo "the release environment does not restrict deployments" >&2; exit 1; }
          policies=$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" \
            --jq '[.branch_policies[] | "\(.type):\(.name)"] | join(",")')
          [ "$policies" = "tag:v*" ] || { echo "release deployments must be limited to v* tags" >&2; exit 1; }

  release:
    needs: environment-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Required reviewer (the owner) and a v* tag policy are set on this
    # environment in the repository settings: the job waits for approval.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the publication scan checks every reachable blob.
          fetch-depth: 0
          persist-credentials: false
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --branch main --event push --status success --json conclusion -q '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "no successful ci.yml push run on main for $GITHUB_SHA; release only green main commits" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
      - name: Tag matches the workspace version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          workspace=$(awk '/^\[workspace.package\]/ { in_section = 1; next } /^\[/ { in_section = 0 }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          if [ "$version" != "$workspace" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Every release gate is checked (final versions)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if printf '%s' "$VERSION" | grep -qE -- '-rc\.[0-9]+$'; then
            echo "pre-release: gates are not required"; exit 0
          fi
          case "$VERSION" in *-*) echo "only -rc.N pre-releases are allowed" >&2; exit 1 ;; esac
          sh packaging/release/check-gates-selftest.sh
          sh packaging/release/check-gates.sh "$VERSION"
      - name: Build artifacts
        run: docker buildx build --progress plain --platform linux/amd64 --target artifacts --output type=local,dest=dist .
      - name: Build Windows artifacts (portable zip and per-user MSI)
        run: docker buildx build --progress plain --platform linux/amd64 --target windows-artifacts --output type=local,dest=dist-windows .
      - name: Check artifacts
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          (cd dist-windows && sha256sum --check --strict SHA256SUMS)
          sh packaging/appimage/verify.sh dist/rust-microsip-*-x86_64.AppImage dist/rust-microsip
          { command -v unsquashfs && command -v msiextract; } || { sudo apt-get update \
            && sudo apt-get install -y --no-install-recommends squashfs-tools msitools; }
          rm -rf dist-windows/tests dist-windows/upgrade-test
          sh packaging/release/scan-publication.sh dist dist-windows
      - name: Assemble release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp dist/rust-microsip "release/rust-microsip-$VERSION-x86_64"
          cp dist/rust-microsip-*-x86_64.AppImage "release/rust-microsip-$VERSION-x86_64.AppImage"
          cp dist/scaffold-sbom.cdx.json "release/rust-microsip-$VERSION-sbom.cdx.json"
          cp "dist-windows/rust-microsip-$VERSION-windows-x86_64.zip" "dist-windows/rust-microsip-$VERSION-x86_64.msi" \
            "dist-windows/rust-microsip-$VERSION-windows-sbom.cdx.json" release/
          tar -C dist -czf "release/rust-microsip-$VERSION-licenses.tar.gz" \
            LICENSE NOTICE cargo-licenses toolchain-licenses build-manifest.json toolchain.txt
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-rc.*) prerelease=--prerelease ;; esac
          notes=--generate-notes
          [ -f "docs/release/v$VERSION.md" ] && notes="--notes-file docs/release/v$VERSION.md"
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag $notes \
            --title "rust-microsip $VERSION" $prerelease
